# Site settings
title: Elliana Pastrano
email: ellianapastrano@gmail.com
url: https://epastrano.github.io/ellianapastrano.github.io/
description: "Data Science Projects"
keywords: " data science, data analytics"
skills: "I am a current data science student who is drawn to work that bridges people, data, and systems to create real-world change. I am particularly interested in using data analysis and machine learning to uncover meaningful patterns and translate complex findings into compelling narratives to support informed decision-making. My goal is to use data-driven insights to highlight needs, evaluate impact, and guide strategies that create measurable improvements for organizations and communities."
meta_author: Pastrano Elliana

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
# - comment the line below if you want to stick with the default PHP contact form
contact: static

# If you use disqus you need disqus shortname
# https://help.disqus.com/customer/portal/articles/466208
disqus_shortname: myshortname

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 18bc9c #80B3FF
  primary-rgb: "24,288,156" #"128,179,255"
  secondary: 2c3e50 #FD6E8A
  secondary-dark: 233140 #A2122F

# Footer settings
footer:
  copyright: Dr. Henry Jekyll
  location: Location
  social: Around the Web

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: github
    url: https://github.com/epastrano

# Postal address (add as many lines as necessary)
address:
  - line: Portland
  - line: Oregon

# Credits content
credits: ''

# Build settings
markdown: kramdown
permalink: pretty

